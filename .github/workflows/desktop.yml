name: Desktop CI

on:
  pull_request:
    branches: [main, update/binaries]
    paths:
      - "linux/**"
      - "nix/**"
      - "packaging/**"
      - "pyproject.toml"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - "external/sunshine"
      - ".gitmodules"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
  push:
    branches: [main, update/binaries]
    paths:
      - "linux/**"
      - "nix/**"
      - "packaging/**"
      - "pyproject.toml"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - "external/sunshine"
      - ".gitmodules"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-qml:
    name: Python tests and QML startup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: linux
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Isolate application settings
        run: |
          mkdir -p "${RUNNER_TEMP}/monitorize-ci-config"
          echo "XDG_CONFIG_HOME=${RUNNER_TEMP}/monitorize-ci-config" >> "${GITHUB_ENV}"
      - name: Install application test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-pyqt6.qtquick python3-jinja2 python3-dbus python3-gi \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            qml6-module-qtqml qml6-module-qtqml-models libqt6svg6
      - name: Run complete Python test suite
        run: timeout 180s /usr/bin/python3 -m unittest discover -s linux/tests -t . -v
      - name: Load all QML components and navigate application pages
        run: timeout 30s /usr/bin/python3 scripts/ci-qml-smoke.py

  nix-evaluation:
    name: Evaluate Nix packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Check locked flake without building packages
        run: nix flake check --no-build --all-systems --no-update-lock-file
      - name: Evaluate CUDA and non-CUDA derivations on both architectures
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux; do
            for package in monitorize monitorize-no-cuda; do
              nix eval --raw --no-update-lock-file ".#packages.${system}.${package}.drvPath"
            done
          done

  rpm-source:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install validation tools
        run: dnf -y install git patch python3 rpm-build pyproject-rpm-macros systemd-rpm-macros firewalld-filesystem

      - name: Checkout pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate native packaging sources
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C external/sunshine config --global --add safe.directory "$GITHUB_WORKSPACE/external/sunshine"
          bash -n packaging/rpm/build.sh packaging/tumbleweed/build.sh
          bash -n packaging/arch/build.sh packaging/arch/container-prepare.sh \
            packaging/arch/container-build.sh \
            packaging/arch/smoke-test.sh packaging/arch/PKGBUILD \
            packaging/arch/dependencies.sh packaging/arch/monitorize.install \
            packaging/arch/monitorize-wrapper
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          sunshine = subprocess.check_output(
              ["git", "-C", "external/sunshine", "rev-parse", "HEAD"], text=True
          ).strip()
          for name in ("rpm", "tumbleweed"):
              spec = Path(f"packaging/{name}/monitorize.spec").read_text()
              assert re.search(rf"(?m)^Version:\s+{re.escape(version)}$", spec)
              assert re.search(rf"(?m)^%global sunshine_commit {sunshine}$", spec)
              assert "-DCUDA_FAIL_ON_MISSING=ON" in spec
              assert "-DSUNSHINE_ENABLE_CUDA=ON" in spec
          arch_pkg = Path("packaging/arch/PKGBUILD").read_text()
          arch_sources = Path("packaging/arch/sources.conf").read_text()
          assert re.search(rf"(?m)^pkgver={re.escape(version)}$", arch_pkg)
          assert re.search(rf"(?m)^SUNSHINE_COMMIT={sunshine}$", arch_sources)
          assert 'local cuda_required=ON' in arch_pkg
          assert 'local cuda_enabled=ON' in arch_pkg
          assert '-DCUDA_FAIL_ON_MISSING="${cuda_required}"' in arch_pkg
          assert '-DSUNSHINE_ENABLE_CUDA="${cuda_enabled}"' in arch_pkg
          PYTHON
          git -C external/sunshine apply --check ../../packaging/sunshine-strict-selection.patch
          rpmspec -P packaging/rpm/monitorize.spec >/dev/null
          bash -n packaging/deb/build.sh packaging/deb/*/build.sh \
            packaging/deb/common/monitorize-wrapper packaging/deb/ubuntu-26.04/monitorize-wrapper
          for script in packaging/deb/*/debian/postinst packaging/deb/*/debian/postrm; do
            sh -n "$script"
          done
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          commit = subprocess.check_output(["git", "-C", "external/sunshine", "rev-parse", "HEAD"], text=True).strip()
          for target in ("debian-trixie", "ubuntu-24.04", "ubuntu-26.04"):
              directory = Path("packaging/deb") / target
              assert re.match(rf"monitorize \({re.escape(version)}\)", (directory / "debian/changelog").read_text()), target
              assert re.search(rf"(?m)^SUNSHINE_COMMIT = {commit}$", (directory / "sunshine.mk").read_text()), target
          rules = Path("packaging/deb/common/rules.mk").read_text()
          assert "-DCUDA_FAIL_ON_MISSING=ON" in rules
          assert "-DSUNSHINE_ENABLE_CUDA=ON" in rules
          PYTHON
