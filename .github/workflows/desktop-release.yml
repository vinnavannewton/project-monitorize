name: Desktop package release

on:
  push:
    tags:
      - "monitorize-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
      asset_names: ${{ steps.release.outputs.asset_names }}
    steps:
      - name: Checkout tagged sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify tag, main branch, and package versions
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^monitorize-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?)$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must use monitorize-vMAJOR.MINOR or monitorize-vMAJOR.MINOR.PATCH format, for example monitorize-v0.33.2." >&2
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on origin/main." >&2
            exit 1
          fi

          python3 - "${tag_version}" <<'PYTHON'
          from pathlib import Path
          import re
          import sys
          import tomllib

          expected = sys.argv[1]
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if project != expected:
              raise SystemExit(
                  f"Tag version {expected} does not match pyproject.toml version {project}."
              )

          checks = {
              "packaging/arch/PKGBUILD": r"(?m)^pkgver=(\S+)$",
              "packaging/rpm/monitorize.spec": r"(?m)^Version:\s+(\S+)$",
              "packaging/tumbleweed/monitorize.spec": r"(?m)^Version:\s+(\S+)$",
              "packaging/deb/debian-trixie/debian/changelog": r"^monitorize \(([^)]+)\)",
              "packaging/deb/ubuntu-24.04/debian/changelog": r"^monitorize \(([^)]+)\)",
              "packaging/deb/ubuntu-26.04/debian/changelog": r"^monitorize \(([^)]+)\)",
          }
          for relative, pattern in checks.items():
              match = re.search(pattern, Path(relative).read_text())
              actual = match.group(1) if match else "missing"
              if actual != expected:
                  raise SystemExit(f"{relative} has version {actual}; expected {expected}.")

          nix = Path("nix/package.nix").read_text()
          versions = re.findall(r'(?m)^\s*version\s*=\s*"([^"]+)";', nix)
          if versions != [expected]:
              raise SystemExit(
                  f"nix/package.nix main package version is {versions or 'missing'}; expected {expected}."
              )
          PYTHON

          echo "version=${tag_version}" >> "${GITHUB_OUTPUT}"
          echo "matrix=$(python3 scripts/package-assets.py matrix)" >> "${GITHUB_OUTPUT}"
          echo "asset_names=$(python3 scripts/package-assets.py manifest "${tag_version}")" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # The shared target list retains Debian with cd_enabled=False.
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Checkout tagged sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify rootless Podman
        run: |
          set -euo pipefail
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman info

      - name: Build and smoke-test CUDA package
        env:
          MONITORIZE_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            arch) ./packaging/arch/build.sh ;;
            fedora-44) ./packaging/rpm/build.sh ;;
            tumbleweed) ./packaging/tumbleweed/build.sh ;;
            debian-trixie) ./packaging/deb/debian-trixie/build.sh ;;
            ubuntu-24.04) ./packaging/deb/ubuntu-24.04/build.sh ;;
            ubuntu-26.04) ./packaging/deb/ubuntu-26.04/build.sh ;;
            *) echo "Unknown build target: ${{ matrix.target }}" >&2; exit 2 ;;
          esac

      - name: Stage installable release asset
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          asset="$(python3 scripts/package-assets.py name "${{ matrix.target }}" "${VERSION}")"
          package="$(python3 scripts/package-assets.py path "${{ matrix.target }}" "${VERSION}")"
          test -s "${package}"
          cp "${package}" "release-assets/${asset}"

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: monitorize-desktop-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all successful packages
        uses: actions/download-artifact@v4
        with:
          pattern: monitorize-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        env:
          EXPECTED_ASSETS: ${{ needs.validate.outputs.asset_names }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          expected = set(json.loads(os.environ["EXPECTED_ASSETS"]))
          assets = list(Path("release-assets").iterdir())
          actual = {path.name for path in assets if path.is_file() and path.stat().st_size > 0}
          if len(assets) != len(expected) or actual != expected:
              raise SystemExit(f"Expected complete enabled-target asset set {sorted(expected)}; found {sorted(actual)}.")
          print("Verified release assets:", *sorted(actual), sep="\n")
          PYTHON

      - name: Stage draft, verify uploads, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_ASSETS: ${{ needs.validate.outputs.asset_names }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Monitorize ${VERSION}" \
            --generate-notes \
            --draft

          gh release upload "${GITHUB_REF_NAME}" release-assets/*
          gh release view "${GITHUB_REF_NAME}" --json assets,isDraft > uploaded-release.json
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("uploaded-release.json").read_text())
          expected = {path.name: path.stat().st_size for path in Path("release-assets").iterdir() if path.is_file()}
          assets = release["assets"]
          actual = {asset["name"]: asset["size"] for asset in assets}
          if (not release["isDraft"] or len(assets) != len(expected)
                  or set(expected) != set(json.loads(os.environ["EXPECTED_ASSETS"]))
                  or actual != expected):
              raise SystemExit("Draft release uploads do not match the complete local package set.")
          PYTHON
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
